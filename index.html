<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>You're Invited</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="is-entering">

  <main class="frame scroll-container" id="mainFrame" style="overflow-y: hidden;">
    <!-- First frame (Play/Pause) -->
    <div class="frame__art scroll-section" id="frameTap" role="button" tabindex="0" aria-label="Play">
      <img class="frame__bg" id="frameImg" src="assets/images/frame1-play.png" alt="Play Invitation">
    </div>

    <!-- Event frames -->
    <div class="frame__art scroll-section">
      <img class="frame__bg" src="assets/images/varmala.png" alt="Varmala Event">
    </div>
    <div class="frame__art scroll-section">
      <img class="frame__bg" src="assets/images/reception.png" alt="Reception Event">
    </div>
    <div class="frame__art scroll-section">
      <img class="frame__bg" src="assets/images/phera.png" alt="Phera Event">
    </div>
  </main>

  <audio id="bgMusic" loop>
    <source src="assets/audio/music.mp3" type="audio/mpeg">
  </audio>

  <script src="assets/js/fade-in.js"></script>
  <script src="assets/js/script.js"></script>
</body>
</html>
